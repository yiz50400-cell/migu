interface:
  display_name: "migu"
  short_description: "采集 TikTok 参考、按结构节奏和重点分镜复刻、检查素材并验收交付"
  default_prompt: "使用 $migu 完成商品视频复刻：图片固定使用已配置接口的 image2.5flare，视频可走多个渠道或账号；按需采集参考，保留结构、节奏和重点，通常最多 6 个真实分镜，分别记录请求时长、可用区间和成片时长；生成后检查实际切镜、穿帮、对应国家语言、视频包装、字幕和最终导出。生成成功不能算完成。"
policy:
  allow_implicit_invocation: true
